<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Medical POS</title>
  <style>
    /* ── Self-hosted Material Icons (ligature icon font) ─────────────── */
    @font-face {
      font-family: "Material Icons";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("./assets/fonts/material-icons.woff2") format("woff2"),
           url("./assets/fonts/material-icons.woff") format("woff");
    }
    @font-face {
      font-family: "Material Icons Outlined";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("./assets/fonts/material-icons-outlined.woff2") format("woff2");
    }
    @font-face {
      font-family: "Material Icons Round";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("./assets/fonts/material-icons-round.woff2") format("woff2");
    }
    @font-face {
      font-family: "Material Icons Sharp";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("./assets/fonts/material-icons-sharp.woff2") format("woff2");
    }
    @font-face {
      font-family: "Material Icons Two Tone";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("./assets/fonts/material-icons-two-tone.woff2") format("woff2");
    }

    .material-icons,
    .material-icons-outlined,
    .material-icons-round,
    .material-icons-sharp,
    .material-icons-two-tone {
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: "liga";
    }
    .material-icons { font-family: "Material Icons"; }
    .material-icons-outlined { font-family: "Material Icons Outlined"; }
    .material-icons-round { font-family: "Material Icons Round"; }
    .material-icons-sharp { font-family: "Material Icons Sharp"; }
    .material-icons-two-tone { font-family: "Material Icons Two Tone"; }

    /* ── Self-hosted Roboto (latin, weights used by the app) ─────────── */
    @font-face {
      font-family: "Roboto";
      font-style: normal;
      font-display: swap;
      font-weight: 300;
      src: url("./assets/fonts/roboto-latin-300-normal.woff2") format("woff2"),
           url("./assets/fonts/roboto-latin-300-normal.woff") format("woff");
    }
    @font-face {
      font-family: "Roboto";
      font-style: normal;
      font-display: swap;
      font-weight: 400;
      src: url("./assets/fonts/roboto-latin-400-normal.woff2") format("woff2"),
           url("./assets/fonts/roboto-latin-400-normal.woff") format("woff");
    }
    @font-face {
      font-family: "Roboto";
      font-style: normal;
      font-display: swap;
      font-weight: 500;
      src: url("./assets/fonts/roboto-latin-500-normal.woff2") format("woff2"),
           url("./assets/fonts/roboto-latin-500-normal.woff") format("woff");
    }
    @font-face {
      font-family: "Roboto";
      font-style: normal;
      font-display: swap;
      font-weight: 700;
      src: url("./assets/fonts/roboto-latin-700-normal.woff2") format("woff2"),
           url("./assets/fonts/roboto-latin-700-normal.woff") format("woff");
    }
  </style>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
