<div class="wrap">
  <mat-card class="card surface" role="region" aria-label="Login form">
    <mat-card-header>
      <mat-card-title>Welcome back</mat-card-title>
      <mat-card-subtitle>Sign in with your email or username</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full">
          <mat-label>Email or Username</mat-label>
          <input matInput formControlName="login" autocomplete="username" placeholder="name@example.com or username" required />
          <mat-error *ngIf="form.controls.login.invalid">Enter your email or username</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Password</mat-label>
          <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" autocomplete="current-password" placeholder="Enter your password" required />
          <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide" type="button">
            <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="form.controls.password.invalid">Password is required</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" class="full" [disabled]="loading || form.invalid">
          <mat-icon>login</mat-icon>
          <span>Sign in</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
