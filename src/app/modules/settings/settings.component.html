<app-page-header title="Settings" subtitle="Store profile, receipt footer, GST and preferences">
  <button mat-stroked-button routerLink="/settings/security"><mat-icon>security</mat-icon>Security</button>
</app-page-header>

<mat-card class="surface panel">
  <mat-card-title>Store settings</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form" class="form">
      <div class="grid2">
        <mat-form-field appearance="outline">
          <mat-label>Store name</mat-label>
          <input matInput formControlName="storeName" required />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput formControlName="storePhone" />
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Address</mat-label>
        <textarea matInput rows="2" formControlName="storeAddress"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Receipt footer</mat-label>
        <textarea matInput rows="2" formControlName="receiptFooter"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>GST enabled</mat-label>
        <mat-select formControlName="gstEnabled">
          <mat-option [value]="true">Enabled</mat-option>
          <mat-option [value]="false">Disabled</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="actions">
        <button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="form.invalid || loading">
          <mat-icon>save</mat-icon>Save
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>

<mat-card class="surface panel">
  <mat-card-title>Database Backup & Restore</mat-card-title>
  <mat-card-content>
    <p class="backup-desc">
      Download a backup of your database to save locally, or restore from a previously saved backup file.
      <strong>Restoring will replace all current data.</strong>
    </p>
    <div class="backup-actions">
      <button mat-raised-button color="primary" (click)="backupDatabase()" [disabled]="backupLoading">
        <mat-icon>{{ backupLoading ? 'hourglass_empty' : 'cloud_download' }}</mat-icon>
        {{ backupLoading ? 'Creating Backup...' : 'Backup Database' }}
      </button>

      <span class="backup-divider">or</span>

      <button mat-stroked-button color="warn" (click)="restoreFileInput.click()" [disabled]="restoreLoading">
        <mat-icon>{{ restoreLoading ? 'hourglass_empty' : 'cloud_upload' }}</mat-icon>
        {{ restoreLoading ? 'Restoring...' : 'Restore Database' }}
      </button>
      <input type="file" #restoreFileInput hidden accept=".sqlite,.db,.bak,.sqlite3" (change)="onRestoreFileSelected($event)" />
    </div>
  </mat-card-content>
</mat-card>
